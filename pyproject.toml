[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forexdecsters"
version = "0.1.0"
description = "CLI to install Windows Server 2019 ServerDatacenter on a Linux KVM VPS over SSH."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "forexdecsters" }]
dependencies = [
    "paramiko>=3.4",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
release = ["pyinstaller>=6.0"]

[project.scripts]
forexdecsters = "forexdecsters.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
forexdecsters = ["payloads/*.py", "payloads/*.sh", "payloads/*.bat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
